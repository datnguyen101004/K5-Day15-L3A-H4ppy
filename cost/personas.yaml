# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 144
  base: 431
  high: 721
  source: "data/preclass 05–25/11/2026 (evidence/count.py, evidence/data-mining.md). Cơ sở 431 = học viên có mở video pre-class. Thấp 144 = 431 − 287 học viên mở video mà không gửi chat nào (M2), tức người đã từng nhắn AI. Cao 721 = tổng tài khoản học viên (data/preclass/README.md)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
                    # Chia theo câu 3 khảo sát (số bài pre-class / tuần), n = 20 phiếu hợp lệ, evidence/survey/results.csv
                    # uses_per_month = trung bình số bài / tuần của nhóm × 4 tuần / tháng, làm tròn — khớp spec.md §2 (quy đổi tự ước tính), 1 phiên / bài (tự ước tính)
                    # turns_per_session = trung vị câu 5 (số lượt trả lời bạn học AI) của nhóm, trần 3 lượt (canvas dòng 6: hỏi vặn ≤ 2 rồi chốt)
  - name: hoc_it
    share: 0.25             # 5/20 phiếu xem 0–1 bài / tuần
    uses_per_month: 2       # trung bình 0,6 bài / tuần × 4 ≈ 2
    turns_per_session: 1    # trung vị câu 5 của nhóm = 1 lượt
    source: "khảo sát C3: 5/20 phiếu 0–1 bài/tuần (trung bình 0,6) · C5 trung vị 1 lượt · ×4 tuần và 1 phiên/bài (tự ước tính)"
  - name: hoc_vua
    share: 0.60             # 12/20 phiếu xem 2–3 bài / tuần
    uses_per_month: 10      # trung bình 2,4 bài / tuần × 4 ≈ 10
    turns_per_session: 1    # trung vị câu 5 của nhóm = 1 lượt
    source: "khảo sát C3: 12/20 phiếu 2–3 bài/tuần (trung bình 2,4) · C5 trung vị 1 lượt · ×4 tuần và 1 phiên/bài (tự ước tính)"
  - name: hoc_nhieu
    share: 0.15             # 3/20 phiếu xem ≥4 bài / tuần
    uses_per_month: 23      # trung bình 5,7 bài / tuần × 4 ≈ 23
    turns_per_session: 3    # trung vị câu 5 của nhóm = "2–3" → lấy 3 = trần canvas dòng 6
    source: "khảo sát C3: 3/20 phiếu ≥4 bài/tuần (trung bình 5,7) · C5 trung vị “2–3”, lấy 3 (trần canvas dòng 6) · ×4 tuần và 1 phiên/bài (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "further-reading/model-prices.md của repo đề (BTC tra https://ai.google.dev/gemini-api/docs/pricing ngày 25/11/2026) · tầng Nhỏ"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "further-reading/model-prices.md của repo đề (BTC tra https://ai.google.dev/gemini-api/docs/pricing ngày 25/11/2026) · tầng Lớn"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
